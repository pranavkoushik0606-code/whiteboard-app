services:
  - type: web
    name: whiteboard-server
    env: node
    plan: free

    rootDir: server

    buildCommand: npm install
    startCommand: npm start

    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 5000

      - key: MONGO_URI
        sync: false

      - key: JWT_SECRET
        sync: false

      - key: JWT_EXPIRES_IN
        value: 7d

      - key: CLIENT_URL
        sync: false

      # One platform router sits in front of the process. Without this req.ip is
      # Render's address for every visitor, so express-rate-limit puts the whole
      # userbase in one bucket, and req.protocol reads http behind Render's TLS.
      - key: TRUST_PROXY
        value: 1