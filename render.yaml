services:
  - type: web
    name: whiteboard-server
    env: node
    plan: free

    rootDir: server

    buildCommand: npm install
    startCommand: npm start

    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 5000

      - key: MONGO_URI
        sync: false

      - key: JWT_SECRET
        sync: false

      - key: JWT_EXPIRES_IN
        value: 7d

      - key: CLIENT_URL
        sync: false

      # TRUST_PROXY is deliberately not set. It overrides the app's default,
      # which trusts every private address in X-Forwarded-For and takes the
      # first public one. A count was tried here and was wrong: `1` reported a
      # 10.x Render router as req.ip, which is the shared-rate-limit-bucket bug
      # the setting exists to prevent. Set it only to override that default.